name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file for tests
      run: |
        cat > .env << EOF
        DATABASE_URL=postgresql+asyncpg://transaction-reports:s3cret_pw0123@postgres:5432/transaction-reports
        REDIS_URL=redis://redis:6379/0
        MOCKFILL=false
        EOF

    - name: Start services with Docker Compose
      run: docker compose up -d postgres redis

    - name: Wait for PostgreSQL to be ready
      run: |
        timeout 30 bash -c 'until docker compose exec -T postgres pg_isready -U transaction-reports; do sleep 1; done'

    - name: Wait for Redis to be ready
      run: |
        timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping; do sleep 1; done'

    - name: Build application image
      run: docker compose build app

    - name: Run database migrations
      run: docker compose run --rm app uv run alembic upgrade head

    - name: Run tests
      run: docker compose run --rm app uv run pytest --cov app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

    - name: Show logs on failure
      if: failure()
      run: docker compose logs

    - name: Cleanup
      if: always()
      run: docker compose down -v
